<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <circle cx="12" cy="16" r="7.25" stroke="#2f8f5b" stroke-width="2" />
            <circle cx="20" cy="16" r="7.25" stroke="#b9beb7" stroke-width="2" />
          </svg>
          <div class="brand-text">
            <div class="brand-name">Nexus</div>
            <div class="brand-sub">Local-first companion</div>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="Primary"></nav>

        <div class="sidebar-foot">
          <div class="net">
            <span class="dot dot-green"></span>
            <div>
              <div class="net-title">Local network</div>
              <div class="net-sub">No cloud connection</div>
            </div>
          </div>
          <div class="version">v0.1.0</div>
        </div>
      </aside>

      <div class="main">
        <header class="main-header">
          <div class="header-titles">
            <h1 id="page-title">Nexus</h1>
            <p class="page-sub" id="page-sub">Your devices, connected locally.</p>
          </div>
          <div class="header-status" id="header-status"></div>
        </header>

        <div class="fatal-bar" id="fatal" hidden></div>

        <main class="content" id="content"></main>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal" id="modal" hidden></div>

    <script src="main.js"></script>
  </body>
</html>
